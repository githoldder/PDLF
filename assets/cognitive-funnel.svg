<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="1.0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#0f172a" rx="16"/>

  <!-- Left Dimension Axis: 认知资源最大化利用 -->
  <g transform="translate(60, 60)">
    <line x1="0" y1="30" x2="0" y2="400" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="-5,395 0,408 5,395" fill="#64748b"/>
    <text x="0" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">表层</text>
    <text x="0" y="435" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">深层</text>
    
    <text x="-15" y="210" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 -15 210)" letter-spacing="4">认知资源最大化利用</text>
  </g>

  <!-- Title -->
  <text x="450" y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">PDLF 认知资源漏斗模型 (Cognitive Funnel)</text>

  <!-- Funnel Trapezoids -->
  <!-- Layer 1: P4 (Top) -->
  <!-- Top: 180 to 580 (width 400), Bottom: 215 to 545 (width 330), y: 80 to 160 -->
  <polygon points="180,80 580,80 545,160 215,160" fill="url(#p4Grad)" filter="url(#shadow)"/>
  <text x="380" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">P4 (简单、浅层问题)</text>

  <!-- Layer 2: P3 -->
  <!-- Top: 218 to 542, Bottom: 260 to 500 (width 240), y: 165 to 245 -->
  <polygon points="218,165 542,165 500,245 260,245" fill="url(#p3Grad)" filter="url(#shadow)"/>
  <text x="380" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">P3 (复杂、浅层问题)</text>

  <!-- Layer 3: P2 -->
  <!-- Top: 263 to 497, Bottom: 310 to 450 (width 140), y: 250 to 330 -->
  <polygon points="263,250 497,250 450,330 310,330" fill="url(#p2Grad)" filter="url(#shadow)"/>
  <text x="380" y="295" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">P2 (简单的深层问题)</text>

  <!-- Layer 4: P1 (Bottom Triangle) -->
  <!-- Top: 313 to 447, Tip: 380,425, y: 335 to 425 -->
  <polygon points="313,335 447,335 380,425" fill="url(#p1Grad)" filter="url(#shadow)"/>
  <text x="380" y="375" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" text-anchor="middle">P1 (复杂根问题)</text>

  <!-- Connectors and Labels on Right Side -->
  <!-- P4 Right -->
  <path d="M 565 120 L 630 120" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="630" cy="120" r="3" fill="#60a5fa"/>
  <text x="645" y="115" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">50%</text>
  <text x="690" y="115" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">快速处理或直接忽略</text>
  <text x="645" y="133" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">不解决本身即工程决策，零心智占用</text>

  <!-- P3 Right -->
  <path d="M 525 205 L 630 205" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="630" cy="205" r="3" fill="#38bdf8"/>
  <text x="645" y="200" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">30%</text>
  <text x="690" y="200" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">文档化、录屏备忘</text>
  <text x="645" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">留存上下文供后续异步处理或团队参考</text>

  <!-- P2 Right -->
  <path d="M 478 290 L 630 290" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="630" cy="290" r="3" fill="#fbbf24"/>
  <text x="645" y="285" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">15%</text>
  <text x="690" y="285" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">脚本自动化、AI代理外包</text>
  <text x="645" y="303" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">编写可复用脚本或让 Agent 批量执行</text>

  <!-- P1 Right -->
  <path d="M 415 380 L 630 380" stroke="#f87171" stroke-width="2"/>
  <circle cx="630" cy="380" r="3" fill="#f87171"/>
  <text x="645" y="375" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">5%</text>
  <text x="680" y="375" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">深度调研与方案博弈</text>
  <text x="645" y="393" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">启动完整 PDLF 闭环（5Why / 结构转化 / 双树）</text>
  <text x="645" y="410" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">人类注意力最高投入区</text>

  <!-- Bottom Quote -->
  <rect x="180" y="465" width="540" height="32" rx="6" fill="#1e293b"/>
  <text x="450" y="486" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    把 95% 的琐碎拦截在防御网外，将 100% 顶尖注意力倾注于 5% 的根因突破
  </text>
</svg>
